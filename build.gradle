// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        minSdk = 24
        targetSdk = 35
        compileSdk = 35
        adapterdelegates = '4.2.0'
        androidPlugin = '8.10.1'
        androidxLegacy = '1.0.0'
        androidxTransition = '1.4.1'
        appCompat = '1.6.1'
        archCore = '2.0.1'
        calendarView = '0.3.4'
        camerax = '1.3.4'
        composeBom = '2022.10.00'
        composePlugin = '1.8.2'
        constraintLayout = '2.1.4'
        coreKtx = '1.12.0'
        coroutines = '1.10.2'
        dexter = '6.2.2'
        espressoCore = '3.2.0'
        exoPlayer = '2.18.5'
        expandableLayout = '2.9.2'
        firebaseBom = '33.11.0'
        firebaseCrashlyticsPlugin = '3.0.4'
        glide = '4.12.0'
        glideCompose = '1.0.0-beta01'
        huaweiAgconnect = "1.9.1.301"
        huaweiPush = "6.11.0.300"
        inputMask = '5.0.0'
        installReferrer = '2.2'
        junit = '4.13.2'
        junitExt = '1.2.1'
        junitRunnerRules = '1.6.0'
        kaspresso = '1.5.3'
        koin = '3.1.5'
        kotlinPlugin = '2.1.21'
        ktlint = '0.37.2'
        kspPlugin = '2.1.21-2.0.1'
        lifecycle = '2.2.0'
        lifecycleViewModel = '2.7.0'
        linphone = '5.3.19'
        material = '1.11.0'
        mlkitBarcode = '17.2.0'
        morphBottomNavigation = '1.0.1'
        moshi = '1.11.0'
        moshiCodegen = '1.11.0'
        navigation = '2.7.6'
        okHttp = '4.9.2'
        onlineChatSdk = "0.1.3"
        openStreetMap = '6.1.20'
        pageIndicator = "v.1.0.3"
        paging = '1.0.1'
        pinEntryEditText = '2.0.6'
        playServicesPlugin = '4.4.2'
        playServicesLocation = '21.3.0'
        preference = "1.2.0"
        recyclerView = '1.3.2'
        retrofit = '2.6.0'
        room = '2.7.2'
        rustorePush = '6.0.0'
        rustoreTracer = '0.3.1'
        safeArgsPlugin = '2.7.6'
        splashscreen = '1.0.1'
        swipeLayout = '1.1.0'
        swipeLayoutRambler = '1.0.17'
        threetenabp = '1.2.3'
        timber = '4.7.1'
        viewpager = '1.0.0'
        webkit = '1.13.0'
        webrtc = '123.0.0'
        lifecycleRuntimeKtx = '2.9.2'
        activityCompose = '1.10.1'
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$androidPlugin"
        classpath "com.huawei.agconnect:agcp:$huaweiAgconnect"
    }
}

plugins {
    id 'com.android.application' version "$androidPlugin" apply false
    id 'org.jetbrains.kotlin.android' version "$kotlinPlugin" apply false
    id 'org.jetbrains.compose' version "$composePlugin" apply false
    id 'org.jetbrains.kotlin.plugin.compose' version "$kotlinPlugin" apply false
    id 'androidx.navigation.safeargs' version "$safeArgsPlugin" apply false
    id 'com.google.devtools.ksp' version "$kspPlugin" apply false
    id 'com.google.gms.google-services' version "$playServicesPlugin" apply false
    id 'com.google.firebase.crashlytics' version "$firebaseCrashlyticsPlugin" apply false
    id 'ru.ok.tracer' version "$rustoreTracer" apply false
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
