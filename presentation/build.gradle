plugins {
    id 'com.android.application'
    id 'org.jetbrains.compose'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.huawei.agconnect'
    id 'ru.ok.tracer'
}

if (rootProject.clientDir != null) {
    def targetConfigs = [
        'google-services.json'   : 'src/google',
        'agconnect-services.json': 'src/huawei'
    ]

    targetConfigs.each { fileName, targetFolder ->
        def srcFile = file("${rootProject.clientDir}/$fileName")
        def destDir = file("${projectDir}/$targetFolder")
        def destFile = file("${destDir}/$fileName")

        if (srcFile.exists()) {
            if (destFile.exists() && Arrays.equals(srcFile.bytes, destFile.bytes)) {
                println "[$fileName] is up to date for flavor ${rootProject.clientDir.name}"
            } else {
                destFile.bytes = srcFile.bytes
                println "[$fileName] is synchronized for flavor ${rootProject.clientDir.name}"
            }
        } else {
            if (destFile.exists()) {
                destFile.delete()
                println "[$fileName] is removed for flavor ${rootProject.clientDir.name}"
            }
        }
    }
}

android {
    compileSdk rootProject.compileSdk

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.sesameware.smartyard_oem"
        minSdk = rootProject.minSdk
        targetSdk = rootProject.targetSdk
        versionCode = 111
        versionName = '1.0.111'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ["ru", "en", "kk", "uz", "hy"]
        vectorDrawables.useSupportLibrary = true
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        disableLint {
            signingConfig = signingConfigs.debug
            debuggable = true
        }
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "${variant.baseName}-v${variant.versionName}(${variant.versionCode}).apk"
        }
    }

    // It must be in that order, otherwise google-services.json won't catch up.
    flavorDimensions = ["market", "site"]

    productFlavors {
        google {
            dimension "market"
        }

        huawei {
            dimension "market"
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }

        rustore {
            dimension "market"
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }

        teledom {
            dimension "site"
            applicationId "com.sesameware.smartyard_oem"
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.2'
    }
    namespace = 'com.sesameware.smartyard_oem'
}

if (project.file('signing.gradle').exists()) {
    apply from: 'signing.gradle'
}

if (file('ext.gradle').exists()) {
    apply from: 'ext.gradle'
}

if (rootProject.clientDir != null) {
    apply from: "flavors.gradle"
}

// Disabling push and analytics plug-in tasks for all builds except selected
tasks.configureEach { task ->
    def taskName = task.name
    def taskNameLower = taskName.toLowerCase()

    // 1. Google Services (process<Variant>GoogleServices)
    if (taskName.endsWith("GoogleServices")) {
        def variantName = taskName.replaceAll('^process|GoogleServices$', '').toLowerCase()
        if (!variantName.contains("google")) {
            task.enabled = false
        }
    }

    // 2. Firebase Crashlytics (uploadCrashlyticsMappingFile..., injectCrashlytics...)
    if (taskNameLower.contains("crashlytics")) {
        if (!taskNameLower.contains("google")) {
            task.enabled = false
        }
    }

    // 3. Huawei AGConnect
    if (taskName.contains("AGCPlugin") || taskNameLower.contains("agconnect")) {
        if (!taskNameLower.contains("huawei")) {
            task.enabled = false
        }
    }

    // 4. RuStore Tracer
    if (taskNameLower.contains("tracer")) {
        if (!taskNameLower.contains("rustore")) {
            task.enabled = false
        }
    }
}

