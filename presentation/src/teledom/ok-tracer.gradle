File propsFile = file("teledom.properties")
Properties props = new Properties()
if (propsFile.exists()) {
    propsFile.withReader('UTF-8') { reader -> props.load(reader) }
}

tracer {
    create('defaultConfig') {
        pluginToken = props.getProperty('ok.tracer.plugin.token', "")
    }
    create('debug') {
        appToken = props.getProperty('ok.tracer.app.token.debug', "")
        uploadMapping = false
        uploadNativeSymbols = false
    }
    create('release') {
        appToken = props.getProperty('ok.tracer.app.token.release', "")
        uploadMapping = true
        uploadNativeSymbols = true
        uploadRetryCount = 3
    }
}
