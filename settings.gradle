pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        gradlePluginPortal()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://developer.huawei.com/repo/' }
        maven { url 'https://artifactory-external.vkpartner.ru/artifactory/maven' }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.github.triplet.play') {
                useModule('com.github.triplet.gradle:play-publisher:3.8.4')
            }
        }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://developer.huawei.com/repo/' }
        maven { url 'https://artifactory-external.vkpartner.ru/artifactory/maven' }
        maven {
            name "linphone.org maven repository"
            url "https://download.linphone.org/maven_repository"
            content {
                includeGroup "org.linphone"
            }
        }
    }
}

include ':presentation', ':data', ':domain', ':lib'
rootProject.name='smartyard-oem-android'
